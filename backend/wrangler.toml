name = "defuselab-study"
main = "worker.js"
compatibility_date = "2024-11-01"

# --- D1 database binding ---
# Create the DB (dashboard: Storage & Databases -> D1 -> Create) or:
#   npx wrangler d1 create defuselab-study
# then paste the returned database_id below and apply backend/schema.sql.
# (For local dev, `wrangler dev --local` works with the placeholder id.)
[[d1_databases]]
binding = "DB"
database_name = "defuselab-study"
database_id = "ceaa30fe-680f-463a-af0f-b9d32baac0b3"

# --- Plain vars (safe to store here / in dashboard "Variables") ---
# End-of-day survey URLs (external: Qualtrics / Google Forms). The worker appends
# ?pid=&day=&arm=&lang=&cohort=. _ZH variants are used for Chinese-language cohorts
# and fall back to the EN URL when absent. Leave empty until the team provides them.
[vars]
SURVEY_URL_D1 = ""
SURVEY_URL_D2 = ""
SURVEY_URL_D1_ZH = ""
SURVEY_URL_D2_ZH = ""
# How long a Community Note waits for a live rival-fandom partner before offering a
# clearly DISCLOSED system sample (ms). Group sessions run long waits on purpose.
# Staggered pairing (v3.2): at most one cross-fandom pair publishes per interval, so notes
# surface one at a time through the task block instead of all at once.
PAIR_INTERVAL_MS = "60000"
# Safety net only — unpaired entries are normally resolved by the sweep when the phase
# leaves 'task'. Must far exceed PAIR_INTERVAL_MS x the number of expected pairs.
PAIRING_TIMEOUT_MS = "600000"
# Comma-separated extra origins allowed to call this API. PUT YOUR PARTICIPANT DOMAIN HERE
# after connecting it in Cloudflare Pages (see MIGRATION.md), e.g. "https://study.example.com".
ALLOWED_ORIGINS_EXTRA = ""
# LLM merge of paired Community Notes (EXPT day 2). Used only when the LLM_API_KEY
# secret is set; any failure falls back to verbatim assembly. OpenAI-compatible API.
# Mainland-China DashScope accounts: set LLM_BASE_URL = "https://dashscope.aliyuncs.com/compatible-mode/v1"
LLM_MODEL = "qwen-plus"
LLM_TOX_MODEL = "qwen-turbo"
# Community Note assembly. "llm" = the two entries are synthesised into one note (the
# manipulation, PLAN §4.3); "verbatim" = mechanical assembly. Every note records which it
# got in collabs.ai_merged, so a fallback can be excluded per-protocol.
NOTE_MERGE_MODE = "llm"
LLM_BASE_URL = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"

# --- Secrets (NOT stored here) ---
# Researcher passphrase that gates /api/dashboard/*  (keeps testers out of analytics):
#   npx wrangler secret put RESEARCHER_TOKEN
# LLM key for note merging (optional):
#   npx wrangler secret put LLM_API_KEY
# or dashboard: Worker -> Settings -> Variables and Secrets -> Add -> Encrypt.
