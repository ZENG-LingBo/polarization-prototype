name = "defuselab-study"
main = "worker.js"
compatibility_date = "2024-11-01"

# --- D1 database binding ---
# Create the DB (dashboard: Storage & Databases -> D1 -> Create) or:
#   npx wrangler d1 create defuselab-study
# then paste the returned database_id below and apply backend/schema.sql.
# (For local dev, `wrangler dev --local` works with the placeholder id.)
[[d1_databases]]
binding = "DB"
database_name = "defuselab-study"
database_id = "ceaa30fe-680f-463a-af0f-b9d32baac0b3"

# --- Plain vars (safe to store here / in dashboard "Variables") ---
# End-of-day survey URLs (external: Qualtrics / Google Forms). The worker appends
# ?pid=&day=&arm=&lang=&cohort=. _ZH variants are used for Chinese-language cohorts
# and fall back to the EN URL when absent. Leave empty until the team provides them.
[vars]
SURVEY_URL_D1 = ""
SURVEY_URL_D2 = ""
SURVEY_URL_D3 = ""
SURVEY_URL_D1_ZH = ""
SURVEY_URL_D2_ZH = ""
SURVEY_URL_D3_ZH = ""
# How long a Community Note waits for a live rival-fandom partner before offering a
# clearly DISCLOSED system sample (ms). Group sessions run long waits on purpose.
PAIRING_TIMEOUT_MS = "90000"

# --- Secrets (NOT stored here) ---
# Researcher passphrase that gates /api/dashboard/*  (keeps testers out of analytics):
#   npx wrangler secret put RESEARCHER_TOKEN
# or dashboard: Worker -> Settings -> Variables and Secrets -> Add -> Encrypt.
