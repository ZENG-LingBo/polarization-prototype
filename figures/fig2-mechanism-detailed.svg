<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1020" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .panel{fill:#ffffff;stroke:#c7ced6;stroke-width:2}
    .inner{fill:#f4f6f8;stroke:#d8dee5;stroke-width:1.5}
    .h1{font-size:26px;font-weight:800;fill:#111827}
    .h2{font-size:22px;font-weight:800;fill:#374151}
    .body{font-size:21px;fill:#111827}
    .quote{font-size:21px;fill:#1f2937}
    .small{font-size:19px;fill:#4b5563}
    .army{fill:#5b3fc4}.blink{fill:#c2255c}
    .chipT{font-size:17px;font-weight:800;fill:#ffffff}
    .callN{fill:#b45309}
    .callT{font-size:21px;font-weight:800;fill:#92400e}
    .callB{font-size:20px;fill:#374151}
    .lead{stroke:#b45309;stroke-width:2.5;fill:none;stroke-dasharray:3 5}
    .ok{fill:#166534}.no{fill:#b91c1c}
  </style>

  <!-- ============ LEFT: anatomy of the note ============ -->
  <text x="40" y="48" class="h1">Ⓐ–Ⓔ  Anatomy of the Community Note — each element is one ingredient of recategorization</text>

  <!-- the note card -->
  <g transform="translate(40,80)">
    <rect width="600" height="620" rx="18" class="panel" stroke="#b45309" stroke-width="2.5"/>
    <text x="24" y="46" font-size="22" font-weight="800" fill="#92400e">📌 COMMUNITY NOTE #14 · pinned by moderators</text>
    <g transform="translate(24,66)">
      <rect width="552" height="88" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
      <text x="16" y="36" class="quote" font-weight="700">"the song that made you fall for K-pop"</text>
      <text x="16" y="66" class="body">— add one song each (ARMY + BLINK) to publish</text>
    </g>
    <!-- slots -->
    <g transform="translate(24,176)">
      <rect width="268" height="150" rx="12" class="inner"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="army"/><text x="49" y="30" text-anchor="middle" class="chipT">ARMY</text>
      <text x="94" y="31" class="small">u/borahae_kim</text>
      <text x="14" y="66" class="quote">"Spring Day — the</text>
      <text x="14" y="92" class="quote">bridge got me through</text>
      <text x="14" y="118" class="quote">finals week"</text>
    </g>
    <g transform="translate(308,176)">
      <rect width="268" height="150" rx="12" class="inner"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="blink"/><text x="49" y="30" text-anchor="middle" class="chipT">BLINK</text>
      <text x="94" y="31" class="small">u/rosie_posie</text>
      <text x="14" y="66" class="quote">"Playing With Fire —</text>
      <text x="14" y="92" class="quote">the chorus hit once and</text>
      <text x="14" y="118" class="quote">it was over for me"</text>
    </g>
    <!-- gate -->
    <g transform="translate(24,348)">
      <rect width="552" height="64" rx="12" fill="#fff" stroke="#b45309" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="16" y="40" class="body" font-style="italic">🔒 publishes ONLY when both fandoms have contributed</text>
    </g>
    <!-- published artifact -->
    <g transform="translate(24,434)">
      <rect width="552" height="120" rx="12" fill="#f0fdf6" stroke="#15803d" stroke-width="2"/>
      <text x="16" y="36" font-size="21" font-weight="800" fill="#166534">🎵 Community Playlist #14 — published</text>
      <rect x="16" y="54" width="70" height="26" rx="13" class="army"/><text x="51" y="72" text-anchor="middle" class="chipT">ARMY</text>
      <text x="94" y="73" class="body">×</text>
      <rect x="116" y="54" width="70" height="26" rx="13" class="blink"/><text x="151" y="72" text-anchor="middle" class="chipT">BLINK</text>
      <text x="200" y="73" class="small">both flairs kept, both authors credited</text>
      <text x="16" y="104" class="small">↗ shared together · replies &amp; upvotes accrue to the joint post</text>
    </g>
    <text x="24" y="596" class="small">Participant view contains no study language — the note only says what to do.</text>
  </g>

  <!-- callouts right of the card -->
  <g transform="translate(700,96)">
    <circle cx="16" cy="10" r="16" class="callN"/><text x="16" y="17" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">A</text>
    <text x="44" y="4" class="callT">Superordinate framing</text>
    <text x="44" y="30" class="callB">Prompt is about K-pop as a whole —</text>
    <text x="44" y="54" class="callB">never "defend your group." The shared</text>
    <text x="44" y="78" class="callB">category is activated, never declared.</text>
  </g>
  <g transform="translate(700,220)">
    <circle cx="16" cy="10" r="16" class="callN"/><text x="16" y="17" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">B</text>
    <text x="44" y="4" class="callT">Dual identity preserved</text>
    <text x="44" y="30" class="callB">Contributions stay flaired ARMY /</text>
    <text x="44" y="54" class="callB">BLINK — the fandom identity is kept;</text>
    <text x="44" y="78" class="callB">the shared one is added, not imposed.</text>
  </g>
  <g transform="translate(700,344)">
    <circle cx="16" cy="10" r="16" class="callN"/><text x="16" y="17" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">C</text>
    <text x="44" y="4" class="callT">Structural interdependence</text>
    <text x="44" y="30" class="callB">The publish gate needs BOTH sides —</text>
    <text x="44" y="54" class="callB">a goal neither fandom can reach</text>
    <text x="44" y="78" class="callB">alone (common fate).</text>
  </g>
  <g transform="translate(700,470)">
    <circle cx="16" cy="10" r="16" class="callN"/><text x="16" y="17" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">D</text>
    <text x="44" y="4" class="callT">Co-owned "we" object</text>
    <text x="44" y="30" class="callB">The artifact is jointly credited and</text>
    <text x="44" y="54" class="callB">shared together — praise lands on</text>
    <text x="44" y="78" class="callB">something OURS, not on either side.</text>
  </g>
  <g transform="translate(700,594)">
    <circle cx="16" cy="10" r="16" class="callN"/><text x="16" y="17" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">E</text>
    <text x="44" y="4" class="callT">Blinding by design</text>
    <text x="44" y="30" class="callB">No purpose disclosure anywhere</text>
    <text x="44" y="54" class="callB">participant-facing — say what to do,</text>
    <text x="44" y="78" class="callB">never what the study is about.</text>
  </g>
  <path class="lead" d="M660,180 H700"/>
  <path class="lead" d="M640,260 H700"/>
  <path class="lead" d="M640,392 H700"/>
  <path class="lead" d="M640,520 H700"/>
  <path class="lead" d="M640,662 H700"/>

  <!-- ============ RIGHT TOP: what the LLM does ============ -->
  <g transform="translate(1120,80)">
    <rect width="520" height="330" rx="18" class="panel"/>
    <text x="24" y="44" class="h1">The LLM is plumbing,</text>
    <text x="24" y="76" class="h1">not a participant</text>
    <!-- pipeline -->
    <g transform="translate(24,100)" font-size="20" fill="#111827">
      <rect width="212" height="52" rx="10" class="inner"/><text x="14" y="32">1 · template bank (30)</text>
      <rect x="260" y="0" width="212" height="52" rx="10" class="inner"/><text x="274" y="32">2 · screen framing</text>
      <rect y="72" width="212" height="52" rx="10" class="inner"/><text x="14" y="104">3 · pair across flairs</text>
      <rect x="260" y="72" width="212" height="52" rx="10" class="inner"/><text x="274" y="104">4 · verbatim layout</text>
      <path d="M212,26 H260" stroke="#374151" stroke-width="3" marker-end="url(#arr2)"/>
      <path d="M366,52 V72" stroke="#374151" stroke-width="3" marker-end="url(#arr2)"/>
      <path d="M260,98 H212" stroke="#374151" stroke-width="3" marker-end="url(#arr2)"/>
    </g>
    <g transform="translate(24,254)" font-size="20" font-weight="700">
      <text class="ok" y="0">✓ templates · pairs · lays out text</text>
      <text class="no" y="32">✗ never poses as a fan or rewrites text</text>
      <text class="no" y="64">✗ never mentions the study ("automated")</text>
    </g>
  </g>

  <!-- ============ RIGHT BOTTOM: evidence pair ============ -->
  <g transform="translate(1120,440)">
    <rect width="520" height="560" rx="18" class="panel"/>
    <text x="24" y="44" class="h1">Same two users, one day apart</text>
    <text x="24" y="74" class="small">Day 1 — before the note (baseline thread)</text>
    <g transform="translate(24,88)">
      <rect width="472" height="96" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="army"/><text x="49" y="30" text-anchor="middle" class="chipT">ARMY</text>
      <text x="14" y="60" class="quote">"ratio + your bias is an industry plant.</text>
      <text x="14" y="86" class="quote">the whole group is marketing 💀"</text>
    </g>
    <g transform="translate(24,196)">
      <rect width="472" height="96" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="blink"/><text x="49" y="30" text-anchor="middle" class="chipT">BLINK</text>
      <text x="14" y="60" class="quote">"obsessed AND pressed 🤡 most toxic</text>
      <text x="14" y="86" class="quote">fandom alive, blocked"</text>
    </g>
    <g transform="translate(120,306)">
      <path d="M140,0 V44" stroke="#b45309" stroke-width="4" marker-end="url(#arr2)"/>
      <text x="160" y="30" font-size="20" font-weight="800" fill="#92400e">co-author Note #14</text>
    </g>
    <text x="24" y="384" class="small">Day 2 — after co-publishing the playlist</text>
    <g transform="translate(24,398)">
      <rect width="472" height="96" rx="12" fill="#f0fdf6" stroke="#15803d" stroke-width="1.5"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="blink"/><text x="49" y="30" text-anchor="middle" class="chipT">BLINK</text>
      <text x="14" y="60" class="quote">"ok wait 'Spring Day' is actually beautiful.</text>
      <text x="14" y="86" class="quote">adding it to my rotation"</text>
    </g>
    <g transform="translate(24,506)">
      <rect width="472" height="44" rx="12" fill="#f0fdf6" stroke="#15803d" stroke-width="1.5"/>
      <rect x="14" y="9" width="70" height="26" rx="13" class="army"/><text x="49" y="27" text-anchor="middle" class="chipT">ARMY</text>
      <text x="94" y="30" class="quote">"we have taste on both sides lol 🤝"</text>
    </g>
  </g>
</svg>
