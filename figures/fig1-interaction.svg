<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1150" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .card{fill:#ffffff;stroke:#c7ced6;stroke-width:2;rx:16}
    .inner{fill:#f4f6f8;stroke:#d8dee5;stroke-width:1.5}
    .stageN{fill:#111827}
    .stageT{font-size:27px;font-weight:700;fill:#111827}
    .day{font-size:24px;font-weight:800;fill:#374151;letter-spacing:1px}
    .body{font-size:22px;fill:#111827}
    .quote{font-size:21px;fill:#1f2937}
    .small{font-size:19px;fill:#4b5563}
    .mut{font-size:20px;fill:#6b7280}
    .army{fill:#5b3fc4}.blink{fill:#c2255c}.sys{fill:#475569}
    .chipT{font-size:17px;font-weight:800;fill:#ffffff}
    .flow{stroke:#374151;stroke-width:3;fill:none}
    .note{stroke:#b45309}
    .tox{font-size:17px;font-weight:700}
  </style>

  <!-- ===== legend ===== -->
  <g transform="translate(40,34)">
    <rect x="0" y="0" width="86" height="30" rx="15" class="army"/><text x="43" y="21" text-anchor="middle" class="chipT">ARMY</text>
    <text x="96" y="22" class="small">BTS fan</text>
    <rect x="180" y="0" width="86" height="30" rx="15" class="blink"/><text x="223" y="21" text-anchor="middle" class="chipT">BLINK</text>
    <text x="276" y="22" class="small">BLACKPINK fan</text>
    <rect x="420" y="0" width="120" height="30" rx="15" class="sys"/><text x="480" y="21" text-anchor="middle" class="chipT">PLATFORM</text>
    <text x="550" y="22" class="small">pinned by moderators (LLM-templated, disclosed as automated)</text>
    <text x="1180" y="22" class="small">▢ cards = participant-facing UI (no study language)</text>
  </g>

  <!-- ===== day bands ===== -->
  <g transform="translate(40,84)">
    <rect x="0" y="0" width="520" height="44" rx="10" fill="#eef1f4"/><text x="20" y="30" class="day">DAY 1 · BASELINE (no feature)</text>
    <rect x="540" y="0" width="1060" height="44" rx="10" fill="#fdf3e3"/><text x="560" y="30" class="day" fill="#92400e">DAY 2 · COMMUNITY NOTE APPEARS IN-FEED (STAGES 2–5)</text>
  </g>

  <!-- ===== Row 1 ===== -->
  <!-- ① baseline toxic thread -->
  <g transform="translate(40,148)">
    <rect width="520" height="330" rx="16" class="card"/>
    <circle cx="34" cy="36" r="20" class="stageN"/><text x="34" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">1</text>
    <text x="66" y="44" class="stageT">Rival-fandom thread heats up</text>
    <g transform="translate(24,70)">
      <rect width="472" height="106" rx="12" class="inner"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="blink"/><text x="49" y="30" text-anchor="middle" class="chipT">BLINK</text>
      <text x="94" y="31" class="small">u/rosie_posie</text>
      <text x="14" y="62" class="quote">"the vocal debate is over, sorry. the other</text>
      <text x="14" y="88" class="quote">fandom can keep coping 💀"</text>
    </g>
    <g transform="translate(24,190)">
      <rect width="472" height="106" rx="12" class="inner"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="army"/><text x="49" y="30" text-anchor="middle" class="chipT">ARMY</text>
      <text x="94" y="31" class="small">u/borahae_kim</text>
      <text x="14" y="62" class="quote">"ratio + your bias is an industry plant.</text>
      <text x="14" y="88" class="quote">the whole group is marketing 💀"</text>
    </g>
    <text x="24" y="322" class="tox" fill="#b91c1c">measured toxicity: HIGH (78 / 100) — requirement R1 met</text>
  </g>

  <!-- ② the note appears -->
  <g transform="translate(600,148)">
    <rect width="500" height="330" rx="16" class="card note"/>
    <circle cx="34" cy="36" r="20" class="stageN"/><text x="34" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">2</text>
    <text x="66" y="44" class="stageT">A pinned task — not a message</text>
    <g transform="translate(24,70)">
      <rect width="452" height="196" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
      <text x="16" y="32" font-size="20" font-weight="800" fill="#92400e">📌 COMMUNITY NOTE #14</text>
      <text x="16" y="66" class="quote" font-weight="700">"the song that made you fall for K-pop"</text>
      <text x="16" y="100" class="body">Add one song each — one from an ARMY</text>
      <text x="16" y="126" class="body">member and one from a BLINK member —</text>
      <text x="16" y="152" class="body">and today's note publishes to the</text>
      <text x="16" y="178" class="body">community playlist.</text>
    </g>
    <text x="24" y="296" class="small">Framed around K-pop as a whole — never either fandom.</text>
    <text x="24" y="322" class="small">Participants are told WHAT TO DO, never why (blinding).</text>
  </g>

  <!-- ③ contribute + gate -->
  <g transform="translate(1140,148)">
    <rect width="500" height="330" rx="16" class="card"/>
    <circle cx="34" cy="36" r="20" class="stageN"/><text x="34" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">3</text>
    <text x="66" y="44" class="stageT">Contribute → publication gate</text>
    <g transform="translate(24,70)">
      <rect width="452" height="104" rx="12" class="inner"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="army"/><text x="49" y="30" text-anchor="middle" class="chipT">ARMY</text>
      <text x="94" y="31" class="small">u/borahae_kim adds:</text>
      <text x="14" y="62" class="quote">"Spring Day — the bridge got me</text>
      <text x="14" y="88" class="quote">through finals week"</text>
    </g>
    <g transform="translate(24,188)">
      <rect width="452" height="104" rx="12" fill="#fff" stroke="#b45309" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="34" cy="52" r="14" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="18 30"/>
      <text x="60" y="44" class="body" font-style="italic">waiting for a fan from the other</text>
      <text x="60" y="70" class="body" font-style="italic">group to finish this with you…</text>
    </g>
    <text x="24" y="322" class="small">One fandom alone cannot publish it (interdependence).</text>
  </g>

  <!-- S-connector row1 -> row2 -->
  <path class="flow" d="M560,313 H600" marker-end="url(#arr)"/>
  <path class="flow" d="M1100,313 H1140" marker-end="url(#arr)"/>
  <path class="flow" d="M1390,478 V520 H290 V560" marker-end="url(#arr)"/>

  <!-- ===== Row 2 ===== -->
  <!-- ④ co-publish + co-share -->
  <g transform="translate(40,560)">
    <rect width="520" height="330" rx="16" class="card note"/>
    <circle cx="34" cy="36" r="20" class="stageN"/><text x="34" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">4</text>
    <text x="66" y="44" class="stageT">Co-published, co-owned, co-shared</text>
    <g transform="translate(24,70)">
      <rect width="472" height="150" rx="12" fill="#f0fdf6" stroke="#15803d" stroke-width="2"/>
      <text x="16" y="34" font-size="21" font-weight="800" fill="#166534">🎵 Community Playlist #14 — published</text>
      <text x="16" y="66" class="small">co-authored by</text>
      <rect x="150" y="48" width="70" height="26" rx="13" class="army"/><text x="185" y="66" text-anchor="middle" class="chipT">ARMY</text>
      <text x="228" y="67" class="body">u/borahae_kim</text>
      <rect x="150" y="82" width="70" height="26" rx="13" class="blink"/><text x="185" y="100" text-anchor="middle" class="chipT">BLINK</text>
      <text x="228" y="101" class="body">u/rosie_posie</text>
      <text x="16" y="136" class="small">↗ shared together · ⬆ 231 upvotes on the joint post</text>
    </g>
    <text x="24" y="264" class="small">Both fandom flairs stay on the artifact (dual identity —</text>
    <text x="24" y="290" class="small">the subgroup is never erased, the shared one is added).</text>
    <text x="24" y="322" class="small">Assembled verbatim — the LLM never rewrites.</text>
  </g>

  <!-- ⑤ warm cross-replies -->
  <g transform="translate(600,560)">
    <rect width="500" height="330" rx="16" class="card"/>
    <circle cx="34" cy="36" r="20" class="stageN"/><text x="34" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">5</text>
    <text x="66" y="44" class="stageT">Tone flips on the same thread</text>
    <g transform="translate(24,70)">
      <rect width="452" height="106" rx="12" class="inner"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="blink"/><text x="49" y="30" text-anchor="middle" class="chipT">BLINK</text>
      <text x="94" y="31" class="small">u/rosie_posie</text>
      <text x="14" y="62" class="quote">"ok wait 'Spring Day' is actually</text>
      <text x="14" y="88" class="quote">beautiful. adding it to my rotation"</text>
    </g>
    <g transform="translate(24,190)">
      <rect width="452" height="106" rx="12" class="inner"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="army"/><text x="49" y="30" text-anchor="middle" class="chipT">ARMY</text>
      <text x="94" y="31" class="small">u/borahae_kim</text>
      <text x="14" y="62" class="quote">"we have taste on both sides lol —</text>
      <text x="14" y="88" class="quote">this one's for all of us 🤝"</text>
    </g>
    <text x="24" y="322" class="tox" fill="#15803d">"we/us" language rises — the signature of recategorization</text>
  </g>

  <!-- ⑥ day 3 -->
  <g transform="translate(1140,560)">
    <rect width="500" height="330" rx="16" class="card"/>
    <circle cx="34" cy="36" r="20" class="stageN"/><text x="34" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">6</text>
    <text x="66" y="44" class="stageT">Day 3 — feature removed</text>
    <g transform="translate(24,70)">
      <rect width="452" height="150" rx="12" class="inner"/>
      <rect x="14" y="12" width="70" height="26" rx="13" class="blink"/><text x="49" y="30" text-anchor="middle" class="chipT">BLINK</text>
      <text x="94" y="31" class="small">u/blink_lisa4</text>
      <text x="14" y="62" class="quote">"unpopular opinion: yesterday's</text>
      <text x="14" y="88" class="quote">community playlist lowkey slapped.</text>
      <text x="14" y="114" class="quote">rematch when? we pick the theme 😤"</text>
    </g>
    <text x="24" y="260" class="small">No note today — the cooperative tone carries over</text>
    <text x="24" y="286" class="small">on its own (or doesn't — that is the Day-3 measure).</text>
    <text x="24" y="322" class="tox" fill="#15803d">measured toxicity: stays LOW (8/100)</text>
  </g>

  <path class="flow" d="M560,725 H600" marker-end="url(#arr)"/>
  <path class="flow" d="M1100,725 H1140" marker-end="url(#arr)"/>

  <!-- ===== bottom strip: protocol + measured toxicity ===== -->
  <g transform="translate(40,940)">
    <rect width="1600" height="170" rx="16" fill="#f8fafc" stroke="#c7ced6" stroke-width="2"/>
    <text x="24" y="40" font-size="23" font-weight="800" fill="#111827">END-OF-DAY TOXICITY (demo run, 0–100) — the drop happens ONLY after the note</text>
    <!-- legend -->
    <rect x="24" y="58" width="26" height="16" fill="#2a78d6"/><text x="58" y="72" class="small">Experiment (community note)</text>
    <rect x="330" y="58" width="26" height="16" fill="none" stroke="#1baf7a" stroke-width="3"/><text x="364" y="72" class="small">Control (inert solo poll — same days, no pairing)</text>
    <text x="820" y="72" class="small">📋 survey after every day · Day 3 adds an exit interview</text>
    <!-- grouped bars: baseline y=150, h scaled /100*60 -->
    <g font-size="18" font-weight="700">
      <!-- Day 1 -->
      <text x="120" y="163" class="small" font-weight="400">Day 1 📋</text>
      <rect x="210" y="103" width="34" height="47" fill="#2a78d6"/><text x="227" y="97" text-anchor="middle" fill="#1e3a8a">78</text>
      <rect x="248" y="103" width="34" height="47" fill="none" stroke="#1baf7a" stroke-width="3"/><text x="265" y="97" text-anchor="middle" fill="#065f46">78</text>
      <!-- Day 2 -->
      <text x="420" y="163" class="small" font-weight="400">Day 2 📋</text>
      <rect x="510" y="146" width="34" height="4" fill="#2a78d6"/><text x="527" y="140" text-anchor="middle" fill="#1e3a8a">6</text>
      <rect x="548" y="103" width="34" height="47" fill="none" stroke="#1baf7a" stroke-width="3"/><text x="565" y="97" text-anchor="middle" fill="#065f46">78</text>
      <!-- Day 3 -->
      <text x="720" y="163" class="small" font-weight="400">Day 3 📋🎙</text>
      <rect x="820" y="145" width="34" height="5" fill="#2a78d6"/><text x="837" y="139" text-anchor="middle" fill="#1e3a8a">8</text>
      <rect x="858" y="95" width="34" height="55" fill="none" stroke="#1baf7a" stroke-width="3"/><text x="875" y="89" text-anchor="middle" fill="#065f46">92</text>
    </g>
    <!-- requirement annotations -->
    <g transform="translate(960,92)">
      <text x="0" y="8" class="tox" fill="#111827">R1 ✓ high before intervention (78 both arms)</text>
      <text x="0" y="36" class="tox" fill="#111827">R2 ✓ control stays high after its inert feature (78)</text>
      <text x="0" y="64" class="tox" fill="#111827">R3 ✓ drop only after the community note (78 → 6)</text>
    </g>
  </g>
</svg>
