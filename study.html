<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>r/kpop — community</title>
<link rel="icon" href="data:," />
<style>
  :root{
    --bg:#0b1416; --card:#101617; --card2:#131c1f; --line:#223034; --line2:#1a262a;
    --ink:#f0f4f5; --ink2:#b7cad4; --mut:#8ba2ad;
    --up:#ff4500; --down:#7193ff; --accent:#0079d3; --join:#d93a00; --good:#34d399;
    --army:#8a63ff; --blink:#ff5c9e; --note:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.4;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","IBM Plex Sans",Roboto,Helvetica,Arial,sans-serif;font-size:14.5px}
  button{font:inherit;cursor:pointer}
  input,textarea,select{font:inherit;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .wrap{max-width:760px;margin:0 auto;padding:0 12px 40px}
  /* top bar */
  .topnav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
    padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line2)}
  .logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:18px}
  .snoo{width:28px;height:28px;border-radius:50%;background:var(--up);display:flex;align-items:center;justify-content:center;font-size:15px}
  .who{margin-left:auto;font-size:12px;color:var(--mut)}
  .flair{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.2px}
  .flair.ARMY{background:rgba(138,99,255,.18);color:#c9b5ff;border:1px solid var(--army)}
  .flair.BLINK{background:rgba(255,92,158,.16);color:#ffb1cd;border:1px solid var(--blink)}
  .flair.SYS{background:rgba(139,162,173,.15);color:#cbd5e1;border:1px solid #475569}
  .flair.NOTE{background:rgba(245,158,11,.14);color:#fcd34d;border:1px solid #b45309}
  /* disclosure */
  .disclose{background:rgba(245,158,11,.07);border-bottom:1px solid rgba(245,158,11,.35);
    padding:6px 14px;font-size:12px;color:#fcd34d}
  /* survey */
  .sv{max-width:640px;margin:0 auto}
  .svprog{color:var(--mut);font-size:12px;margin-bottom:12px}
  .svblock{margin-bottom:22px}
  .svblock>h3{margin:0 0 4px;font-size:15px}
  .svstem{color:var(--mut);font-size:13px;margin-bottom:12px}
  .svitem{margin:16px 0;padding-bottom:4px}
  .svq{font-size:14px;font-weight:600;margin-bottom:8px;line-height:1.45}
  .svq .req{color:#fca5a5}
  .svscale{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .svopt{min-width:42px;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;
    color:var(--ink2);padding:9px 12px;font-weight:700;font-size:13px}
  .svopt.on{border-color:var(--accent);color:var(--ink);background:rgba(0,121,211,.14)}
  .svanchor{color:var(--mut);font-size:11.5px}
  .svslider{width:100%;margin:6px 0 2px}
  .svval{font-weight:800;font-size:14px;min-width:34px;display:inline-block;text-align:right}
  .svtext{width:100%;min-height:78px;background:var(--card2);border:1.5px solid var(--line);
    border-radius:10px;color:inherit;padding:10px;font:inherit;font-size:13.5px;resize:vertical}
  .svnav{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .svitem.missing .svq{color:#fca5a5}
  /* screens */
  .screen{display:none}.screen.on{display:block}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
  .panel h2{margin:0 0 6px;font-size:20px}
  .panel .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  .field{margin:14px 0}
  .field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;color:var(--ink2);padding:10px 14px;font-weight:600}
  .opt.on{border-color:var(--accent);color:var(--ink);background:rgba(0,121,211,.12)}
  .check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink2);margin:12px 0}
  .check input{accent-color:var(--accent);margin-top:2px}
  .consentbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2)}
  .btn{background:var(--accent);border:none;color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.gold{background:var(--note);color:#3b2a05}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--ink)}
  .err{color:#fca5a5;font-size:13px;min-height:18px;margin-top:8px}
  .langbtn{margin-left:10px;background:var(--card2);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:4px 12px;font-size:12px}
  .offline-note{font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:10px;padding:8px 11px;margin-top:12px}
  /* day banner */
  .daybar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:9px 14px;margin-top:14px;font-size:13px;color:var(--ink2)}
  .daybar b{color:var(--ink)}
  .daybar .end{margin-left:auto}
  /* posts */
  .feed{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  .pmeta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);flex-wrap:wrap}
  .uav{width:24px;height:24px;border-radius:50%;flex:0 0 24px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800}
  .uav.ARMY{background:linear-gradient(135deg,#5b3bd6,var(--army))}
  .uav.BLINK{background:linear-gradient(135deg,#d63b7e,var(--blink))}
  .uav.SYS{background:linear-gradient(135deg,#475569,#64748b)}
  .pmeta b{color:var(--ink2)}
  .ptext{font-size:14px;margin:6px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
  .actions{display:flex;gap:8px;font-size:12px}
  .pillbtn{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid transparent;
    color:var(--ink2);border-radius:999px;padding:4px 11px;font-weight:600}
  .pillbtn:hover{border-color:var(--line)}
  .pillbtn.voted{color:var(--up)}
  .cmt{margin:8px 0 0 30px;border-left:2px solid var(--line2);padding:6px 0 0 10px}
  .cmt .cmt{margin-left:14px}
  .cmt .cmt .cmt{margin-left:6px}
  .cactions{margin-top:4px}
  .cactions .pillbtn{font-size:11px;padding:2px 8px}
  .replying{font-size:12px;color:var(--note);margin-top:6px;display:none}
  /* pinned feature cards */
  .pinned{border:1px solid var(--note);border-radius:14px;background:linear-gradient(180deg,rgba(245,158,11,.10),rgba(245,158,11,.02));padding:12px 14px;margin-top:12px}
  .pinned .ph{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:#fde68a;margin-bottom:4px}
  .pinned .pp{font-size:13.5px;color:var(--ink)}
  .slotwrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  @media(max-width:560px){.slotwrap{grid-template-columns:1fr}}
  .slot{border:1px dashed var(--line);border-radius:10px;padding:9px 11px;min-height:56px;font-size:12.5px}
  .slot .sh{font-size:10.5px;font-weight:800;margin-bottom:4px}
  .slot.army .sh{color:#c9b5ff}.slot.blink .sh{color:#ffb1cd}
  .slot.filled{border-style:solid;background:var(--card2)}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--note);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .published{margin-top:6px;border:1px solid var(--good);border-radius:10px;padding:9px 11px;background:rgba(52,211,153,.07);font-size:13px}
  .addrow{display:flex;gap:8px;margin-top:8px}
  .addrow input{flex:1;border-radius:999px}
  .pollopt{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;
    padding:8px 12px;font-size:13.5px;background:var(--card2);color:var(--ink);margin-top:6px;overflow:hidden}
  .pollopt .fillbar{position:absolute;inset:0;width:0;background:rgba(113,147,255,.16);transition:width .5s ease}
  .pollopt span{position:relative}
  .sysnote{font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:9px;padding:7px 10px;margin-top:8px}
  /* composer */
  .composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 14px;border-top:1px solid var(--line2);margin-top:14px}
  .composer .row{display:flex;gap:8px}
  .composer textarea{flex:1;resize:none;min-height:44px;border-radius:12px}
  /* done */
  .rejoin{font-size:22px;font-weight:800;letter-spacing:3px;background:var(--card2);border:1px dashed var(--note);
    color:#fde68a;border-radius:12px;padding:10px 18px;display:inline-block;margin:10px 0}
  footer{max-width:760px;margin:20px auto;padding:0 14px;font-size:11px;color:var(--mut);text-align:center}
</style>
</head>
<body>

<div class="topnav">
  <div class="logo"><div class="snoo">🎤</div><span id="t-brand">r/kpop</span></div>
  <span class="who" id="who" hidden>· <b id="me-handle"></b> <span class="flair" id="me-flair"></span></span>
  <button class="langbtn" id="langbtn">中文</button>
</div>
<div class="disclose" id="disclose"></div>

<div class="wrap">

  <!-- ============ JOIN + CONSENT ============ -->
  <section class="screen on" id="s-join">
    <div class="panel">
      <h2 id="t-join-h"></h2>
      <div class="sub" id="t-join-sub"></div>
      <div class="field"><label id="t-cohort"></label><input id="in-cohort" maxlength="12" style="text-transform:uppercase" placeholder="e.g. PILOT1"/></div>
      <div class="field"><label id="t-rejoin"></label><input id="in-rejoin" maxlength="8" style="text-transform:uppercase" placeholder="—"/></div>
      <div class="err" id="join-err"></div>
      <button class="btn" id="join-go" disabled></button>
      <div class="offline-note" id="offline-note" hidden></div>
    </div>
  </section>

  <!-- ============ SESSION ============ -->
  <section class="screen" id="s-session">
    <div class="daybar"><span id="t-daylab"></span><b id="day-num"></b><button class="btn ghost end" id="finish-btn" style="padding:7px 16px;font-size:13px"></button></div>
    <div id="pinned-mount"></div>
    <div class="feed" id="feed"></div>
    <div class="composer">
      <div class="replying" id="replying"></div>
      <div class="row">
        <textarea id="composer-input"></textarea>
        <button class="btn" id="post-btn"></button>
      </div>
    </div>
  </section>

  <!-- ============ DONE ============ -->
  <!-- survey (blocking: the task block must not start before Survey 1 is submitted) -->
  <section class="screen" id="s-survey">
    <div class="panel sv">
      <h2 id="sv-title"></h2>
      <div class="sub" id="sv-intro"></div>
      <div class="svprog" id="sv-prog"></div>
      <div id="sv-body"></div>
      <div class="err" id="sv-err"></div>
      <div class="svnav">
        <button class="btn ghost" id="sv-back" hidden></button>
        <button class="btn" id="sv-next"></button>
      </div>
    </div>
  </section>

  <!-- waiting between phases (Survey 1 submitted, task block not yet open) -->
  <section class="screen" id="s-wait">
    <div class="panel" style="text-align:center">
      <h2 id="t-wait-h"></h2>
      <div class="sub" id="t-wait-sub"></div>
      <div style="margin-top:16px"><span class="spin"></span></div>
    </div>
  </section>

  <section class="screen" id="s-done">
    <div class="panel" style="text-align:center">
      <h2 id="t-done-h"></h2>
      <div class="sub" id="t-done-sub"></div>
      <div><span class="rejoin" id="rejoin-code"></span></div>
      <div class="sub" id="t-rejoin-keep"></div>
      <div style="margin:14px 0"><button class="btn gold" id="survey-btn" hidden></button></div>
      <div class="consentbox" style="text-align:left"><b id="t-debrief-h"></b> <span id="t-debrief-b"></span></div>
    </div>
  </section>

</div>
<footer id="t-footer"></footer>

<script src="assets/config.js?v=4"></script>

<script>
/* ================================================================== i18n */
const STR = {
  en: {
    brand:"r/kpop", disclose:"ⓘ automated: daily activities and layout on this community are automated. your posts are your own.",
    join_h:"Join today's community session", join_sub:"A small K-pop community. Browse, react, and post like you would on any forum.",

    note_wait:"waiting for a fan from the other group to finish this with you…",
    note_you:"you", note_sys:"No live partner was available just now, so a clearly-labelled system-generated sample completed the note. In a live session this comes from a fan in the other group.",

    done_h:"That's it for today 🎉", done_sub:"Thanks for taking part. Your personal code (needed to rejoin on the next day):",

  },
  zh: {

    join_h:"加入今天的社区活动", join_sub:"一个小型K-pop社区。像在任何论坛一样浏览、互动、发帖。",
    cohort:"场次代码（由研究团队提供）", rejoin:"你的个人代码（如果你前一天参加过——第一天留空）",
    fandom:"你属于哪个粉丝群体？", age:"我确认我已年满18岁。",
    consent_h:"知情同意与数据记录。", consent_b:"这是一个研究平台。你的发帖、互动及输入的文字（包括未经处理的原文）将被记录用于研究。你可能会看到不文明的内容。参与完全自愿，你可以随时退出。",
    consent_ok:"我已了解并同意。", join_go:"进入社区",
    offline:"未配置后端——当前为单机预览模式（打开两个窗口可模拟两名参与者）。",
    daylab:"第", finish:"结束今天", post:"发布", composer_ph:"参与讨论…",
    replying_to:"回复", cancel:"（点击取消）",
    note_ph:"你的歌 + 一句理由…", note_add:"添加我的", note_pin:"📌 置顶 · 社区共创",
    note_wait:"等待另一个粉丝群体的成员来完成…",
    note_you:"你", note_sys:"刚才没有在线的搭档，因此由明确标注的系统示例完成了这次共创。正式场次中这将来自另一群体的真实粉丝。",
    poll_pin:"📌 置顶 · 每日投票", published:"已发布到社区",
    done_h:"今天到此为止 🎉", done_sub:"感谢参与。你的个人代码（下次进入时需要）：",
    rejoin_keep:"请截图或记下来——明天进入时输入。",
    survey:"📋 填写今日简短问卷", debrief_h:"关于本社区。",
    sv_next:"下一页", sv_submit:"提交", sv_prog:"第 {a} 页，共 {b} 页",
    sv_required:"请回答标出的问题后继续。",
    wait_h:"感谢填写 — 请稍候 ⏳", wait_sub:"社区活动稍后继续，请保持此页面打开。",
    debrief_b:"该平台属于一项关于网络社区交流方式的研究。部分每日活动由系统自动生成（它们不会代写你的发言）。如有内容令你不适，请联系研究团队。",
    err_cohort:"请输入研究团队提供的场次代码。", err_nocohort:"未找到该场次代码。",
    err_closed:"该场次已关闭。", err_rejoin:"未找到该个人代码。",
    err_link:"请使用研究团队发送给你的个人邀请链接（或输入前一天获得的个人代码）。",
    footer:"研究平台 · 与Reddit、HYBE、YG无关 · 发言将被记录用于研究",
    seedname:"社区", err_generic:"连接失败——请重试。",
  },
};
let LANG = "en";
const T = (k) => (STR[LANG] && STR[LANG][k]) || STR.en[k] || k;

/* ================================================================== client */
const $ = (s) => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const CFG = window.STUDY_CONFIG || {};
const BACKEND = (qs.get("backend") || CFG.BACKEND_URL || "").replace(/\/$/, "");
const hasBackend = !!BACKEND;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
const initials = (n) => String(n||"?").replace(/[^a-zA-Z]/g, "").slice(0, 2).toUpperCase() || "?";
const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

async function call(path, opts = {}) {
  const r = await fetch(BACKEND + path, {
    method: opts.method || "GET",
    headers: { "content-type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || "http " + r.status), { status: r.status, code: data.error });
  return data;
}

/* ---- offline preview client (single browser, localStorage-shared across windows) ---- */
const LSK = "defuselab_v3_local";
const NOTE_LOCAL = { en: { prompt: "Community Note — today's playlist: add the song that made YOU fall for K-pop. Publishes once one ARMY and one BLINK have both added one.", artifact: '🎵 Community Playlist — "the songs that made us fall for K-pop"', fillerText: "adding 'As If It's Your Last' — the energy pulled me in" } };
const POLL_LOCAL = { en: { prompt: "Daily vibe check — how are we feeling today?", options: ["😤 hyped", "😐 meh", "🫠 tired", "🎧 locked in"] } };
const lload = () => { try { return JSON.parse(localStorage.getItem(LSK)) || { participants: [], events: [], collabs: [], votes: [] }; } catch { return { participants: [], events: [], collabs: [], votes: [] }; } };
const lsave = (s) => localStorage.setItem(LSK, JSON.stringify(s));
const OFFLINE = {
  start(b) {
    const s = lload();
    const day = Number(qs.get("day")) || 1;
    let part = b.rejoin ? s.participants.find((p) => p.rejoin_code === String(b.rejoin).toUpperCase()) : null;
    if (!part) {
      const arm = ["EXPT", "CTRL"].includes(qs.get("arm")) ? qs.get("arm") : ["EXPT", "CTRL"][s.participants.length % 2];
      const flair = b.flair || "ARMY";
      part = { id: uid("p"), rejoin_code: Math.random().toString(36).slice(2, 8).toUpperCase(), handle: (flair === "ARMY" ? "army_" : "blink_") + Math.random().toString(36).slice(2, 6), arm, flair };
      s.participants.push(part); lsave(s);
    }
    if (!s.events.some((e) => e.type === "post" && e.day === day)) {
      [["ARMY","seed_mod_a","BTS is the defining group of this generation, it's genuinely not close 🏆 discuss."],
       ["BLINK","seed_mod_b","BLACKPINK outsold and outperformed — the numbers don't lie. change my mind."]].forEach(([flair, author, text]) => {
        ["EXPT","CTRL"].forEach((arm) => s.events.push({ id: uid("ev"), session_id: null, arm, day, flair, author, type: "post", text_raw: text, thread_id: "seed", created_at: Date.now() }));
      });
      lsave(s);
    }
    return { sessionId: uid("sess") , participantId: part.id, rejoinCode: part.rejoin_code, handle: part.handle,
      arm: part.arm, flair: part.flair, day, language: "en", cohortLabel: "LOCAL PREVIEW", offline: true, _part: part,
      note: part.arm === "EXPT" && day === 2 ? NOTE_LOCAL.en : null, poll: part.arm === "CTRL" && day === 2 ? POLL_LOCAL.en : null };
  },
  feed(sess, since) {
    const s = lload();
    const posts = s.events.filter((e) => e.arm === sess.arm && e.day === sess.day && e.created_at > since && ["post","comment","note_published"].includes(e.type)).slice(-200);
    // Offline preview drives the phase from ?phase= so the survey flow can be walked
    // through without a backend; omit it and the old day-based behaviour stands.
    const phase = qs.get("phase");
    if (!phase) return { posts };
    const done = (s.surveys || []).filter((r) => r.session_id === sess.sessionId).map((r) => r.instrument);
    const want = phase === "survey1" ? (sess.day >= 2 ? "survey2" : "survey1")
      : phase === "survey2" ? "survey2" : phase === "microcheck" ? "microcheck" : null;
    const paired = sess.arm === "EXPT" && (s.collabs || []).some((c) => c.is_live_paired &&
      (c.session_id === sess.sessionId || c.b_session_id === sess.sessionId));
    return { posts, phase,
      survey: want && !done.includes(want) ? { instrument: want, showM5: want === "microcheck" && paired } : null,
      note: phase === "task" && sess.arm === "EXPT" ? NOTE_LOCAL.en : null,
      poll: phase === "task" && sess.arm === "CTRL" ? POLL_LOCAL.en : null };
  },
  submitSurvey(sess, instrument, answers) {
    const s = lload();
    (s.surveys = s.surveys || []).push({ id: uid("sr"), session_id: sess.sessionId, instrument,
      phase: "day" + sess.day, payload_json: JSON.stringify(answers), created_at: Date.now() });
    lsave(s);
  },
  event(sess, type, text, threadId) {
    const s = lload();
    s.events.push({ id: uid("ev"), session_id: sess.sessionId, arm: sess.arm, day: sess.day, flair: sess.flair, author: sess.handle, type, text_raw: text, thread_id: threadId || "seed", created_at: Date.now() });
    lsave(s);
  },
  contribute(sess, text) {
    const s = lload();
    const match = s.collabs.find((c) => c.status === "waiting" && c.a_flair !== sess.flair);
    if (match) {
      match.status = "paired"; match.b_flair = sess.flair; match.b_text = text; match.b_handle = sess.handle; match.is_live_paired = 1; match.b_session_id = sess.sessionId;
      s.events.push({ id: uid("ev"), session_id: sess.sessionId, arm: "EXPT", day: sess.day, flair: "SYS", author: "kpop_mod", type: "note_published",
        text_raw: `${NOTE_LOCAL.en.artifact} — "${match.a_text}" (${match.a_handle} · ${match.a_flair}) × "${text}" (${sess.handle} · ${sess.flair})`, thread_id: "note", created_at: Date.now() });
      lsave(s);
      return { collabId: match.id, status: "paired", isLivePaired: true, partner: { flair: match.a_flair, text: match.a_text, handle: match.a_handle }, artifact: NOTE_LOCAL.en.artifact };
    }
    const col = { id: uid("col"), session_id: sess.sessionId, a_flair: sess.flair, a_text: text, a_handle: sess.handle, status: "waiting", created_at: Date.now() };
    s.collabs.push(col); lsave(s);
    return { collabId: col.id, status: "waiting" };
  },
  status(id) {
    const s = lload();
    const col = s.collabs.find((c) => c.id === id);
    if (!col) return { status: "unknown" };
    if (col.status === "waiting" && Date.now() - col.created_at > (CFG.PAIRING_TIMEOUT_MS || 12000)) {
      col.status = "filler"; col.filler = 1; col.b_flair = col.a_flair === "ARMY" ? "BLINK" : "ARMY"; col.b_text = NOTE_LOCAL.en.fillerText; col.b_handle = "system_sample"; lsave(s);
    }
    return { status: col.status, isLivePaired: !!col.is_live_paired, filler: !!col.filler,
      partner: col.b_text ? { flair: col.b_flair, text: col.b_text, handle: col.b_handle } : null, artifact: NOTE_LOCAL.en.artifact };
  },
  vote(sess, opt) { const s = lload(); s.votes.push({ day: sess.day, option_idx: opt }); lsave(s); },
  results(sess) { const s = lload(); return { counts: POLL_LOCAL.en.options.map((_, i) => s.votes.filter((v) => v.day === sess.day && v.option_idx === i).length) }; },
};

function placeEvent(e) {
  if (seenIds.has(e.id)) return;
  seenIds.add(e.id);
  lastTs = Math.max(lastTs, e.created_at);
  if (e.type === "comment" && e.thread_id && e.thread_id !== "seed") {
    // parent may be a post OR another comment (reply-to-reply); orphans (parent outside
    // the feed window) still render comment-styled at the bottom — never as a post card
    const host = document.querySelector(`.post[data-id="${e.thread_id}"] > .cmts, .cmt[data-id="${e.thread_id}"] > .cmts`);
    (host || $("#feed")).appendChild(cmtCard(e));

  }
  $("#feed").appendChild(postCard(e));

async function pollFeed() {
  try {
    const data = hasBackend
      ? await call(`/api/feed?sessionId=${encodeURIComponent(SESS.sessionId)}&since=${lastTs}`)
      : OFFLINE.feed(SESS, lastTs);
    (data.posts || []).forEach(placeEvent);
    applyPhase(data);
  } catch {}
}

/* ---- phase: the researcher steps the cohort through the session -------------
   free -> survey1 -> task -> microcheck -> done   (day 1)
   free -> survey2 -> done                          (day 2)
   Survey 1 gates the task block, so while a survey is due nothing else is reachable. */
let PHASE = null, SURVEY_OPEN = false;
function applyPhase(data) {
  if (!data || data.phase === undefined || data.phase === null) return; // no phase set: legacy day-based flow
  const due = data.survey;
  if (due && !SURVEY_OPEN) { openSurvey(due.instrument, due.showM5); return; }
  if (SURVEY_OPEN) return;                       // never yank a survey out from under them
  PHASE = data.phase;
  if (PHASE === "done") { finishSession(); return; }
  // Only free discussion and the task block are interactive. A survey phase whose
  // instrument is already submitted parks the participant until the researcher moves on,
  // which is what keeps the task block shut until Survey 1 is in.
  const interactive = PHASE === "free" || PHASE === "task";
  screen(interactive ? "session" : "wait");
  if (interactive && (data.note || data.poll) && !$("#pinned-mount").children.length) {
    SESS.note = data.note || null; SESS.poll = data.poll || null;   // feature arrives with the phase, not the day
    mountPinned();
  }
}

/* ================================================================== surveys */
const SV = { instrument: null, pages: [], page: 0, answers: {}, showM5: false };
function rival() {
  const lab = (window.SURVEYS && window.SURVEYS.RIVAL_LABEL[SESS.flair]) || { en: "the other group", zh: "对方群体" };
  return lab[LANG] || lab.en;
}
const svText = (o) => o ? String((o[LANG] != null ? o[LANG] : o.en) || "").replace(/\{RIVAL\}/g, rival()) : "";

function openSurvey(instrument, showM5) {
  const spec = window.SURVEYS && window.SURVEYS[instrument];
  if (!spec) return;
  SURVEY_OPEN = true;
  SV.instrument = instrument; SV.answers = {}; SV.page = 0; SV.showM5 = !!showM5;
  // M5 is shown only to a participant the platform actually paired (dual-identity check).
  SV.pages = spec.pages.map((pg) => Object.assign({}, pg, {
    items: pg.items.filter((it) => it.routed !== "m5" || SV.showM5),
  })).filter((pg) => pg.items.length);
  $("#sv-title").textContent = svText(spec.title);
  $("#sv-intro").textContent = svText(spec.intro);
  clearInterval(pollTimer);
  screen("survey");
  renderSurveyPage();
}
function renderSurveyPage() {
  const pg = SV.pages[SV.page];
  $("#sv-err").textContent = "";
  $("#sv-prog").textContent = T("sv_prog").replace("{a}", SV.page + 1).replace("{b}", SV.pages.length);
  const wrap = document.createElement("div"); wrap.className = "svblock";
  if (pg.title) { const h = document.createElement("h3"); h.textContent = svText(pg.title); wrap.appendChild(h); }
  if (pg.stem) { const d = document.createElement("div"); d.className = "svstem"; d.textContent = svText(pg.stem); wrap.appendChild(d); }
  pg.items.forEach((it) => wrap.appendChild(renderItem(it, pg)));
  const body = $("#sv-body"); body.innerHTML = ""; body.appendChild(wrap);
  $("#sv-back").hidden = SV.page === 0;
  $("#sv-next").textContent = SV.page === SV.pages.length - 1 ? T("sv_submit") : T("sv_next");
  window.scrollTo(0, 0);
}
function renderItem(it, pg) {
  const box = document.createElement("div"); box.className = "svitem"; box.dataset.id = it.id;
  const q = document.createElement("div"); q.className = "svq";
  q.textContent = svText(it.stem);
  if (it.required) { const r = document.createElement("span"); r.className = "req"; r.textContent = " *"; q.appendChild(r); }
  box.appendChild(q);
  const anchors = (it.anchors || pg.anchors);
  const a = anchors ? (anchors[LANG] || anchors.en) : null;

  if (it.type === "slider0100") {
    const row = document.createElement("div");
    row.innerHTML = `<input type="range" class="svslider" min="0" max="100" step="1" value="50">
      <div class="svscale"><span class="svanchor">0</span>
      <span style="flex:1"></span><span class="svval">—</span><span style="flex:1"></span>
      <span class="svanchor">100</span></div>`;
    const inp = row.querySelector("input"), out = row.querySelector(".svval");
    inp.oninput = () => { SV.answers[it.id] = Number(inp.value); out.textContent = inp.value; box.classList.remove("missing"); };
    box.appendChild(row);
  } else if (it.type === "text") {
    const t = document.createElement("textarea"); t.className = "svtext";
    t.oninput = () => { SV.answers[it.id] = t.value.trim(); box.classList.remove("missing"); };
    box.appendChild(t);
  } else if (it.type === "yesno") {
    const opts = (it.options && (it.options[LANG] || it.options.en)) || ["Yes", "No"];
    box.appendChild(scaleRow(opts.map((o, i) => [o, i === 0 ? 1 : 0]), it, box));
  } else {
    const n = it.type === "semdiff7" ? 7 : 5;
    box.appendChild(scaleRow(Array.from({ length: n }, (_, i) => [String(i + 1), i + 1]), it, box, a));
  }
  return box;
}
function scaleRow(pairs, it, box, anchors) {
  const row = document.createElement("div"); row.className = "svscale";
  if (anchors) { const lo = document.createElement("span"); lo.className = "svanchor"; lo.textContent = anchors[0]; row.appendChild(lo); }
  pairs.forEach(([label, val]) => {
    const b = document.createElement("button"); b.className = "svopt"; b.type = "button"; b.textContent = label;
    b.onclick = () => {
      SV.answers[it.id] = val;
      [...row.querySelectorAll(".svopt")].forEach((x) => x.classList.toggle("on", x === b));
      box.classList.remove("missing");
    };
    row.appendChild(b);
  });
  if (anchors) { const hi = document.createElement("span"); hi.className = "svanchor"; hi.textContent = anchors[1]; row.appendChild(hi); }
  return row;
}
$("#sv-back").onclick = () => { if (SV.page > 0) { SV.page--; renderSurveyPage(); } };
$("#sv-next").onclick = async () => {
  const pg = SV.pages[SV.page];
  const missing = pg.items.filter((it) => it.required &&
    (SV.answers[it.id] === undefined || SV.answers[it.id] === ""));
  if (missing.length) {
    $("#sv-err").textContent = T("sv_required");
    missing.forEach((it) => { const el = $("#sv-body").querySelector(`[data-id="${it.id}"]`); if (el) el.classList.add("missing"); });
    $("#sv-body").querySelector(".missing").scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  if (SV.page < SV.pages.length - 1) { SV.page++; renderSurveyPage(); return; }
  $("#sv-next").disabled = true;
  try {
    if (hasBackend) await call("/api/survey/submit", { method: "POST", body: { sessionId: SESS.sessionId, instrument: SV.instrument, answers: SV.answers } });
    else OFFLINE.submitSurvey(SESS, SV.instrument, SV.answers);
  } catch {}
  $("#sv-next").disabled = false;
  SURVEY_OPEN = false;
  // Survey 2 ends the participant's day; Survey 1 hands back to the waiting room.
  if (SV.instrument === "survey2") { finishSession(); return; }
  screen("wait");
  startFeed();
};

/* ================================================================== pinned features (day 2) */
function mountPinned() {
  const m = $("#pinned-mount"); m.innerHTML = "";
  if (SESS.note) mountNote(m);
  if (SESS.poll) mountPoll(m);
}
function mountNote(m) {
  const card = document.createElement("div"); card.className = "pinned";
  card.innerHTML = `
    <div class="ph">${esc(T("note_pin"))}</div>
    <div class="pp"></div>
    <div class="slotwrap">
      <div class="slot army" id="slotA"><div class="sh">ARMY</div><div class="empty"><span class="spin"></span> …</div></div>
      <div class="slot blink" id="slotB"><div class="sh">BLINK</div><div class="empty"><span class="spin"></span> …</div></div>
    </div>
    <div id="note-out"></div>
    <div class="addrow"><input id="note-input" placeholder="${esc(T("note_ph"))}" maxlength="300"/><button class="btn gold" id="note-go">${esc(T("note_add"))}</button></div>`;
  card.querySelector(".pp").textContent = SESS.note.prompt;
  m.appendChild(card);
  $("#note-go").onclick = () => runNote(card);
}
function fillSlot(sel, who) {
  const el = $(sel); el.classList.add("filled");
  el.innerHTML = `<div class="sh">${sel === "#slotA" ? "ARMY" : "BLINK"}</div>
    <div style="font-size:11px;color:var(--mut);margin-bottom:2px">${esc(who.handle || "")}</div>${esc(who.text)}`;
  const otherSel = sel === "#slotA" ? "#slotB" : "#slotA";
  const o = $(otherSel);
  if (o && !o.classList.contains("filled")) o.querySelector(".empty").innerHTML = `<span class="spin"></span> ` + esc(T("note_wait"));
}
async function runNote(card) {
  const input = $("#note-input"); const text = input.value.trim(); if (!text) return;
  $("#note-go").disabled = true; input.disabled = true;
  fillSlot(SESS.flair === "ARMY" ? "#slotA" : "#slotB", { handle: SESS.handle, text });
  let res;
  try { res = hasBackend ? await call("/api/collab/contribute", { method: "POST", body: { sessionId: SESS.sessionId, text } }) : OFFLINE.contribute(SESS, text); }
  catch { $("#note-go").disabled = false; input.disabled = false; return; }
  let st = res.status === "paired" ? res : null;
  while (!st || st.status === "waiting") {
    await sleep(3000);
    st = hasBackend ? await call("/api/collab/status?id=" + encodeURIComponent(res.collabId)) : OFFLINE.status(res.collabId);
    if (st.status === "paired" || st.status === "filler") break;
  }
  if (st.partner) fillSlot(st.partner.flair === "ARMY" ? "#slotA" : "#slotB", st.partner);
  const out = $("#note-out");
  out.innerHTML = `<div class="published">✅ ${esc(st.artifact || "")} · ${esc(T("published"))}</div>` +
    (st.filler ? `<div class="sysnote">${esc(T("note_sys"))}</div>` : "");
  pollFeed();
}
function mountPoll(m) {
  const card = document.createElement("div"); card.className = "pinned";
  card.innerHTML = `<div class="ph">${esc(T("poll_pin"))}</div><div class="pp"></div><div id="poll-opts"></div>`;
  card.querySelector(".pp").textContent = SESS.poll.prompt;
  m.appendChild(card);
  const opts = card.querySelector("#poll-opts");
  SESS.poll.options.forEach((o, i) => {
    const b = document.createElement("button"); b.className = "pollopt";
    b.innerHTML = `<span class="fillbar"></span><span>${esc(o)}</span>`;
    b.onclick = async () => {
      try { hasBackend ? await call("/api/poll/vote", { method: "POST", body: { sessionId: SESS.sessionId, option: i } }) : OFFLINE.vote(SESS, i); } catch {}
      const r = hasBackend ? await call("/api/poll/results?sessionId=" + encodeURIComponent(SESS.sessionId)).catch(() => null) : OFFLINE.results(SESS);
      if (r && r.counts) {
        const total = r.counts.reduce((a, x) => a + x, 0) || 1;
        [...opts.children].forEach((el, j) => { el.querySelector(".fillbar").style.width = Math.round((r.counts[j] / total) * 100) + "%"; el.disabled = true; });
      }
    };
    opts.appendChild(b);
  });
}

/* ================================================================== finish */

async function finishSession() {
  clearInterval(pollTimer);
  try { if (hasBackend) await call("/api/session/end", { method: "POST", body: { sessionId: SESS.sessionId } }); } catch {}
  $("#rejoin-code").textContent = SESS.rejoinCode || "—";
  if (hasBackend) {
    try {
      const s = await call("/api/survey-link?sessionId=" + encodeURIComponent(SESS.sessionId));
      if (s.url) { const b = $("#survey-btn"); b.hidden = false; b.onclick = () => window.open(s.url, "_blank"); }
    } catch {}
  }
  screen("done");
}

/* ================================================================== boot */
renderStrings();
if (!hasBackend) { $("#offline-note").hidden = false; $("#offline-note").textContent = T("offline"); $("#in-cohort").value = "LOCAL"; }
if (qs.get("cohort")) $("#in-cohort").value = qs.get("cohort").toUpperCase();
try {
  const saved = JSON.parse(localStorage.getItem("defuselab_v3_rejoin") || "null");
  if (saved && saved.rejoin) { $("#in-rejoin").value = saved.rejoin; if (!$("#in-cohort").value) $("#in-cohort").value = saved.cohort || ""; }
} catch {}
validate();
</script>
</body>
</html>
